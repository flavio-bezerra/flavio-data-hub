name: Deploy to HostGator

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🏗️ Build Project
      run: npm run build

    - name: 📂 Sync files to HostGator
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # HostGator: raiz web é /public_html/
        server-dir: /public_html/
        # Pasta local onde o Vite cria o site
        local-dir: ./dist/
        # Protocolo seguro (HostGator suporta FTPS na porta 990)
        protocol: ftps
        port: 990
        # Modo passivo (necessário na maioria dos servidores compartilhados)
        passive: true
        # Limpa arquivos antigos no servidor que não existem no novo build
        # Cuidado: se tiver uploads de usuários no servidor, mude para false
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**