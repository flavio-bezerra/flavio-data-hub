name: Deploy to HostGator

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🏗️ Build Project
      run: npm run build

    - name: 📂 Sync files to HostGator
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # HostGator: raiz web é /public_html/
        server-dir: /public_html/
        # Pasta local onde o Vite cria o site
        local-dir: ./dist/
        # FTP padrão porta 21 com TLS opcional (loose = tenta FTPS, cai para FTP se falhar)
        port: 21
        security: loose
        # timeout maior para conexões lentas
        timeout: 120000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**