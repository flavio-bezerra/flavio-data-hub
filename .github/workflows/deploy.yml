name: Deploy to HostGator

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🏗️ Build Project
      run: npm run build

    - name: 🔍 Verify build output
      run: |
        echo "=== dist/ contents ==="
        ls -la dist/
        echo "=== dist/assets/ ==="
        ls -la dist/assets/ || true
        echo "=== .htaccess exists? ==="
        test -f dist/.htaccess && echo "✅ .htaccess found" || echo "❌ .htaccess MISSING"

    - name: 📂 Sync files to HostGator
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Configuração original que funcionava: usuário FTP já cai na pasta correta
        server-dir: ./
        # Pasta local onde o Vite cria o site
        local-dir: ./dist/
        # Timeout maior para conexões lentas
        timeout: 120000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**

    - name: ✅ Verify deployment
      run: |
        echo "Deploy completed. Site should be live at https://casamento-flavio-victoria.com.br/"
        echo "Check: favicon 🌿, title 'Victoria & Flávio', convite editorial"