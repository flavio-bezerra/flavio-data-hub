name: Deploy to HostGator

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install Dependencies
      run: npm install

    - name: 🏗️ Build Project
      run: npm run build

    - name: 📂 Sync files to HostGator
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Como o usuário FTP já cai na pasta certa, usamos ./
        server-dir: ./
        # Pasta local onde o Vite cria o site
        local-dir: ./dist/
        # IMPORTANTE: Isso apaga arquivos velhos no servidor que não existem mais no novo build
        # Deixe false se tiver arquivos lá (como imagens de upload) que não podem ser apagados
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
