bundle:
  name: casamento-victoria-flavio

# Preparação de sincronização isolada. Não cria job nem publica Git/HostGator.
# A pasta Git existente continua separada do root de desenvolvimento do bundle.
workspace:
  host: https://adb-2481770933719198.18.azuredatabricks.net

sync:
  include:
    - entrega/site.bin
    - notebooks/preparar-pasta-git.py
  exclude:
    # O projeto completo vai dentro do pacote, não como acervo avulso.
    - public/**
    - src/**
    - docs/**
    - agents/**
    - scripts/**
    - .agent-skills/**
    - .github/**
    - .git/**
    - .databricks/**
    - '*.json'
    - '*.md'
    - '*.ts'
    - '*.html'
    - '*.bat'
    - '*.js'
    - '*.cjs'
    - '*.mjs'

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
