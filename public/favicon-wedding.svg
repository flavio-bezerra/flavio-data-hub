<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Olive Leaf Favicon - Emoji style, clean, recognizable at 16x16 -->
  <defs>
    <style>
      .leaf { fill: #4A5845; }
      .leaf-light { fill: #687A64; }
      .leaf-vein { fill: none; stroke: #3D4A38; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>
  
  <!-- Main olive leaf - centered, emoji-like, optimized for small sizes -->
  <g transform="translate(50, 50) rotate(-12)">
    <!-- Leaf body - clean silhouette -->
    <path class="leaf" d="M 0,-35 
      C -16,-40 -24,-30 -22,-14 
      C -20,0 -12,14 -4,22 
      C 4,30 16,28 22,18 
      C 24,10 22,0 16,-8 
      C 12,-14 8,-22 0,-35 Z"/>
    
    <!-- Leaf highlight (lighter side) - gives depth -->
    <path class="leaf-light" d="M 0,-35 
      C -10,-38 -16,-30 -14,-14 
      C -12,0 -6,12 -2,18 
      C 2,24 8,22 12,14 
      C 14,8 10,0 6,-8 
      C 4,-14 2,-22 0,-35 Z"/>
    
    <!-- Central vein -->
    <path class="leaf-vein" d="M 0,-33 Q 0,-12 0,20"/>
    
    <!-- Side veins -->
    <path class="leaf-vein" d="M 0,-24 Q -7,-8 -4,4" opacity="0.6"/>
    <path class="leaf-vein" d="M 0,-24 Q 7,-8 4,4" opacity="0.6"/>
    <path class="leaf-vein" d="M 0,-12 Q -6,2 -3,10" opacity="0.5"/>
    <path class="leaf-vein" d="M 0,-12 Q 6,2 3,10" opacity="0.5"/>
  </g>
</svg>