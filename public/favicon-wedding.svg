<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDFBF7"/>
      <stop offset="100%" style="stop-color:#F5F0E8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Olive leaf garland top -->
  <g fill="none" stroke="#4A5845" stroke-width="1.5" stroke-linecap="round">
    <path d="M 20 25 Q 35 15 50 25 Q 65 15 80 25"/>
    <path d="M 22 23 Q 32 18 42 22"/>
    <path d="M 48 20 Q 55 14 62 20"/>
    <path d="M 58 22 Q 68 17 78 22"/>
  </g>
  
  <!-- Ampersand symbol (elegant) -->
  <text x="50" y="68" font-family="Georgia, serif" font-size="52" font-weight="400" fill="#4A5947" text-anchor="middle" dominant-baseline="central" style="font-style: italic;">&</text>
  
  <!-- Olive leaf garland bottom -->
  <g fill="none" stroke="#4A5845" stroke-width="1.5" stroke-linecap="round" transform="translate(0, 50) scale(1, -1) translate(0, -50)">
    <path d="M 20 25 Q 35 15 50 25 Q 65 15 80 25"/>
    <path d="M 22 23 Q 32 18 42 22"/>
    <path d="M 48 20 Q 55 14 62 20"/>
    <path d="M 58 22 Q 68 17 78 22"/>
  </g>
  
  <!-- Small lavender accent dots -->
  <circle cx="28" cy="20" r="1.5" fill="#A9A4BC"/>
  <circle cx="72" cy="20" r="1.5" fill="#A9A4BC"/>
  <circle cx="28" cy="80" r="1.5" fill="#A9A4BC"/>
  <circle cx="72" cy="80" r="1.5" fill="#A9A4BC"/>
</svg>