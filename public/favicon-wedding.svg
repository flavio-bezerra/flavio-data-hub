<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Olive Leaf Favicon - Minimalist, elegant, recognizable at 16x16 -->
  <defs>
    <style>
      .leaf { fill: #4A5845; }
      .leaf-light { fill: #687A64; }
      .leaf-vein { fill: none; stroke: #3D4A38; stroke-width: 1.5; stroke-linecap: round; }
    </style>
  </defs>
  
  <!-- Main olive leaf - centered, optimized for small sizes -->
  <g transform="translate(50, 50) rotate(-15)">
    <!-- Leaf body -->
    <path class="leaf" d="M 0,-32 
      C -14,-38 -22,-28 -20,-12 
      C -18,2 -10,14 -2,20 
      C 6,26 14,24 20,14 
      C 22,8 20,-2 14,-10 
      C 10,-16 6,-24 0,-32 Z"/>
    
    <!-- Leaf highlight (lighter side) -->
    <path class="leaf-light" d="M 0,-32 
      C -10,-36 -16,-28 -14,-12 
      C -12,2 -6,12 -2,18 
      C 2,22 6,20 10,12 
      C 12,8 10,-2 6,-10 
      C 4,-16 2,-24 0,-32 Z"/>
    
    <!-- Central vein -->
    <path class="leaf-vein" d="M 0,-30 Q 0,-10 0,18"/>
    
    <!-- Side veins -->
    <path class="leaf-vein" d="M 0,-22 Q -6,-8 -4,4" opacity="0.6"/>
    <path class="leaf-vein" d="M 0,-22 Q 6,-8 4,4" opacity="0.6"/>
    <path class="leaf-vein" d="M 0,-10 Q -5,2 -3,10" opacity="0.5"/>
    <path class="leaf-vein" d="M 0,-10 Q 5,2 3,10" opacity="0.5"/>
  </g>
</svg>