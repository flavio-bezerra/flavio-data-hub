<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- V & F Monogram - Optimized for tiny sizes (16x16, 32x32) -->
  <defs>
    <style>
      .line { fill: none; stroke: #C9B896; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .line-dark { fill: none; stroke: #2A2A2A; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  
  <!-- Optional: subtle circle background for contrast on browser tabs -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#C9B896" stroke-width="1.5" opacity="0.25"/>
  
  <!-- Monogram centered -->
  <g transform="translate(50, 50)">
    <!-- V (left) - clean, wide strokes for visibility at 16px -->
    <path class="line" d="M -18, -16 L -6, 16 L 6, -16" />
    
    <!-- F (right) - minimal strokes -->
    <path class="line" d="M 6, -16 L 18, -16 M 6, -16 L 6, 16 M 6, -2 L 14, -2" />
    
    <!-- Subtle connecting curve -->
    <path class="line" d="M -4, 3 Q 0, 10 4, 3" stroke-width="3.5" opacity="0.6"/>
  </g>
</svg>